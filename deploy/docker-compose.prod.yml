# ── Production Docker Compose ──────────────────────────────────────
# Usage:
#   docker compose -f deploy/docker-compose.prod.yml up -d
#
# Requires a .env file with:
#   DATABASE_URL=postgresql+asyncpg://regwatch:REPLACE_ME@db:5432/regwatch
#   REGWATCH_SCHEDULER_ENABLED=true
#   (optional) REGWATCH_SCHEDULE_* overrides

services:
  db:
    image: postgres:16-alpine
    container_name: regwatch-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: regwatch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-regwatch}
      POSTGRES_DB: regwatch
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U regwatch"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - regwatch

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: regwatch-app
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://regwatch:regwatch@db:5432/regwatch}
      REGWATCH_SCHEDULER_ENABLED: ${REGWATCH_SCHEDULER_ENABLED:-true}
      REGWATCH_SCHEDULE_EPA_TSCA: ${REGWATCH_SCHEDULE_EPA_TSCA:-}
      REGWATCH_SCHEDULE_ECHA_REACH: ${REGWATCH_SCHEDULE_ECHA_REACH:-}
      REGWATCH_SCHEDULE_CHINA_MEE: ${REGWATCH_SCHEDULE_CHINA_MEE:-}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - regwatch

  nginx:
    image: nginx:1.27-alpine
    container_name: regwatch-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot
    depends_on:
      - app
    networks:
      - regwatch

volumes:
  pgdata:
  certbot_www:

networks:
  regwatch:
    driver: bridge
